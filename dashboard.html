<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Singh Niwas | Guest Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
        }

        :root {
            --primary: #1891d1;
            --primary-dark: #0f6ea2;
            --success: #2ecc71;
            --warning: #f39c12;
            --danger: #e74c3c;
            --gray-bg: #f4f9fe;
            --card-white: #ffffff;
            --text-dark: #1a2c3e;
            --text-muted: #5a6e7c;
            --border-light: #e9edf2;
            --shadow: 0 8px 20px rgba(0, 0, 0, 0.03), 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        body {
            background: var(--gray-bg);
            color: var(--text-dark);
            line-height: 1.4;
        }

        /* layout */
        .app-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 20px 24px 40px;
        }

        /* header row */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
            background: var(--card-white);
            padding: 16px 24px;
            border-radius: 28px;
            box-shadow: var(--shadow);
        }

        .greeting h1 {
            font-size: 1.65rem;
            font-weight: 700;
            color: var(--primary-dark);
        }

        .greeting p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .btn-outline, .btn-logout {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            background: white;
            border: 1px solid var(--border-light);
            color: var(--text-dark);
        }

        .btn-outline:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .btn-logout {
            background: #fff5f5;
            border-color: #ffe0e0;
            color: var(--danger);
        }

        .btn-logout:hover {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
        }

        /* stat cards grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 18px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--card-white);
            padding: 20px 16px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 14px;
            transition: transform 0.2s;
        }

        .stat-card:hover { transform: translateY(-3px); }

        .stat-icon {
            width: 52px;
            height: 52px;
            background: #eef6fc;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: var(--primary);
        }

        .stat-info h3 { font-size: 1.8rem; font-weight: 700; }
        .stat-info p { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }

        .section-card {
            background: var(--card-white);
            border-radius: 28px;
            box-shadow: var(--shadow);
            margin-bottom: 32px;
            overflow: hidden;
        }

        .card-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .card-header h2 {
            font-size: 1.35rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-sm {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-sm:hover { background: var(--primary-dark); }

        .table-wrapper {
            overflow-x: auto;
            padding: 0 0 8px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border-light);
        }

        th {
            background: #fafcfd;
            font-weight: 600;
            color: #2c3e4e;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-block;
            white-space: nowrap;
        }

        .badge-pending { background: #fff3cf; color: #b86f0c; }
        .badge-confirmed { background: #e0f7ea; color: #1d6f3c; }
        .badge-paid { background: #d9f0ec; color: #117f6b; }
        .badge-unpaid { background: #ffe6e5; color: #c23d2b; }
        .badge-hourly { background: #eaeef5; color: #2c5f8a; }

        .btn-icon {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1.2rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: 500;
        }

        .btn-icon:hover { opacity: 0.7; }

        .empty-message {
            padding: 32px;
            text-align: center;
            color: var(--text-muted);
        }

        /* booking form styles */
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            flex: 1;
            min-width: 180px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #2c3e4e;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-light);
            border-radius: 20px;
            font-size: 0.9rem;
            background: white;
            transition: 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(24,145,209,0.2);
        }

        .booking-type-toggle {
            display: flex;
            gap: 20px;
            margin-bottom: 28px;
            background: #f8fafc;
            padding: 12px 20px;
            border-radius: 60px;
            width: fit-content;
        }

        .booking-type-toggle label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        .total-price-box {
            background: #f0f7fe;
            padding: 14px 20px;
            border-radius: 24px;
            margin: 16px 0;
            text-align: right;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .alert-message {
            padding: 12px 16px;
            border-radius: 30px;
            margin-bottom: 18px;
            font-size: 0.85rem;
        }

        .alert-success { background: #e0f7ea; color: #196f3d; }
        .alert-error { background: #ffe6e5; color: #b91c1c; }

        footer {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 32px;
        }
    </style>
</head>
<body>
<div class="app-container">
    
    <div class="top-bar">
        <div class="greeting">
            <h1>Welcome, <span id="userNameDisplay">Rajesh</span>!</h1>
            <p>Manage your stays & payments</p>
        </div>
        <div class="action-buttons">
            <a href="#" class="btn-outline" id="homeBtn"><ion-icon name="home-outline"></ion-icon> Home</a>
            <button class="btn-logout" id="logoutBtn"><ion-icon name="log-out-outline"></ion-icon> Logout</button>
        </div>
    </div>

   
    <div id="dashboardView">
      
        <div class="stats-grid" id="statsContainer"></div>

        
        <div class="section-card">
            <div class="card-header">
                <h2><ion-icon name="calendar-outline"></ion-icon> Recent Bookings</h2>
                <button class="btn-sm" id="newBookingBtn"><ion-icon name="add-circle-outline"></ion-icon> New Booking</button>
            </div>
            <div class="table-wrapper" id="recentBookingsTable"></div>
        </div>

       
        <div class="section-card">
            <div class="card-header">
                <h2><ion-icon name="card-outline"></ion-icon> Recent Payments</h2>
                <button class="btn-sm" id="viewPaymentsBtn"><ion-icon name="receipt-outline"></ion-icon> All Payments</button>
            </div>
            <div class="table-wrapper" id="recentPaymentsTable"></div>
        </div>
    </div>

 
    <div id="newBookingView" style="display: none;">
        <div class="section-card">
            <div class="card-header">
                <h2><ion-icon name="bed-outline"></ion-icon> Reserve a Room</h2>
                <button class="btn-sm" id="backToDashboardBtn"><ion-icon name="arrow-back-outline"></ion-icon> Back</button>
            </div>
            <div style="padding: 20px 24px 28px;">
                <div class="booking-type-toggle">
                    <label><input type="radio" name="bookingTypeRad" value="daily" checked> <ion-icon name="sunny-outline"></ion-icon> Daily</label>
                    <label><input type="radio" name="bookingTypeRad" value="hourly"> <ion-icon name="time-outline"></ion-icon> Hourly</label>
                </div>
                <form id="bookingForm">
                    <div class="form-group">
                        <label>Select room *</label>
                        <select id="roomSelect" required></select>
                    </div>

                    
                    <div id="dailyFields">
                        <div class="form-row">
                            <div class="form-group"><label>Check-in date</label><input type="date" id="checkIn" required></div>
                            <div class="form-group"><label>Check-out date</label><input type="date" id="checkOut" required></div>
                        </div>
                    </div>

              
                    <div id="hourlyFields" style="display: none;">
                        <div class="form-row">
                            <div class="form-group"><label>Booking date</label><input type="date" id="hourlyDate"></div>
                            <div class="form-group"><label>Check-in time</label><input type="time" id="checkInTime"></div>
                            <div class="form-group"><label>Check-out time</label><input type="time" id="checkOutTime"></div>
                        </div>
                    </div>

                    <div id="availabilityMsg" class="alert-message" style="display: none;"></div>
                    <div class="total-price-box">Total: <strong id="totalAmountDisplay">NRS 0.00</strong></div>
                    <input type="hidden" id="totalAmountHidden" value="0">
                    <button type="submit" class="btn-sm" id="confirmBookingBtn" style="width: 100%; padding: 12px; justify-content: center;" disabled>Confirm Booking</button>
                </form>
            </div>
        </div>
    </div>

  
    <div id="paymentsListView" style="display: none;">
        <div class="section-card">
            <div class="card-header">
                <h2><ion-icon name="document-text-outline"></ion-icon> Complete Payment History</h2>
                <button class="btn-sm" id="backFromPaymentsBtn"><ion-icon name="arrow-back-outline"></ion-icon> Back</button>
            </div>
            <div class="table-wrapper" id="fullPaymentsTable"></div>
        </div>
    </div>
</div>
<footer>Singh Niwas — your comfort, our tradition</footer>
